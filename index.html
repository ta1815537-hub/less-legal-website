<!doctype html>
<html lang="en" class="bg-slate-50 dark:bg-[#0B0E17]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Security & Anti-Hacking Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(self https://checkout.razorpay.com https://api.razorpay.com)" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://translate.google.com https://translate.googleapis.com https://apis.google.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://less-legal.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://translate.google.com https://translate.googleapis.com; connect-src 'self' https:; object-src 'none'; base-uri 'self';" />
    
    <!-- SEO Optimization -->
    <title>Less Creation | Technology & Digital Product Studio</title>
    <meta name="description" content="Less Creation builds simple, useful and affordable digital products designed to solve real-world problems. Discover Less Legal, our flagship Android product, and explore what we're creating." />
    <meta name="keywords" content="Less Creation, Anurag Gurauli, Less Legal, technology studio, digital products, software studio, Android apps, legal tools, productivity tools" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lesscreation.com/" />
    
    <!-- Chrome / Android Browser Theme & Color Scheme Integration -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0E17" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
    <meta name="theme-color" content="#F8FAFC" id="app-theme-color" />
    
    <!-- PWA Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Less Creation" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lesscreation.com/" />
    <meta property="og:title" content="Less Creation | Technology & Digital Product Studio" />
    <meta property="og:description" content="Less Creation builds simple, useful and affordable digital products designed to solve real-world problems. Discover Less Legal, our flagship Android product, and explore what we're creating." />
    <meta property="og:site_name" content="Less Creation" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lesscreation.com/" />
    <meta name="twitter:title" content="Less Creation | Technology & Digital Product Studio" />
    <meta name="twitter:description" content="Less Creation builds simple, useful and affordable digital products designed to solve real-world problems. Discover Less Legal, our flagship Android product, and explore what we're creating." />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Favicon & Search Engine Icon Optimization -->
    <link rel="icon" type="image/png" href="/images/lg.png" />
    <link rel="shortcut icon" type="image/png" href="/images/lg.png" />
    <link rel="apple-touch-icon" href="/images/lg.png" />
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B0E17] text-slate-900 dark:text-[#F5F2EE] antialiased selection:bg-[#2563EB] selection:text-white min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
